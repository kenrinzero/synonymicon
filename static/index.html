<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synonymicon</title>
  <meta name="description" content="Multi-source synonym discovery with frequency-band filtering — WordNet and fastText candidates across eleven frequency corpora.">
  <meta name="theme-color" content="#f3ede2">
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="%23ebe3d4"/><text x="16" y="24" font-family="Georgia,serif" font-size="23" font-style="italic" text-anchor="middle" fill="%232a241c">S</text></svg>'>
  <meta property="og:title" content="Synonymicon">
  <meta property="og:description" content="Multi-source synonym discovery with frequency-band filtering.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://synonymicon.xyz/">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Palette — warm cream tray, lighter inner cells */
      --background:        #f3ede2;
      --surface:           #ebe3d4;   /* outer "tray" cards — slightly warmer */
      --column:            #f7f2e8;   /* inner column cells — lighter than surface */
      --foreground:        #2a241c;
      --foreground-muted:  rgba(42, 36, 28, 0.65);
      --foreground-faint:  rgba(42, 36, 28, 0.45);
      --border:            rgba(42, 36, 28, 0.10);
      --border-strong:     rgba(42, 36, 28, 0.18);

      /* Shadows — soft for outer tray, subtle for inner cells */
      --shadow-soft:       0 8px 32px -8px rgba(50, 40, 25, 0.10),
                           0 2px 8px -2px rgba(50, 40, 25, 0.05);
      --shadow-subtle:     0 1px 4px rgba(50, 40, 25, 0.04);

      /* Derived */
      --watermark:         rgba(42, 36, 28, 0.07);
      --footer-bg:         rgba(235, 227, 212, 0.5);
      --error:             #a05050;

      /* Typography */
      --font-serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;

      /* Layout */
      --left-ratio: 38fr;
      --right-ratio: 62fr;
      --gap-outer: 2.5rem;
      --gap-inner: 1rem;        /* gap between column cells */
      --radius-outer: 2rem;
      --radius-inner: 1.5rem;

      /* Animation */
      --page-transition: 220ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── Theme: penumbra (dark) ── */
    body[data-theme="penumbra"] {
      --background:        #1a1a1e;
      --surface:           #222226;
      --column:            #2a2a2e;
      --foreground:        #e0ddd6;
      --foreground-muted:  rgba(224, 221, 214, 0.60);
      --foreground-faint:  rgba(224, 221, 214, 0.35);
      --border:            rgba(224, 221, 214, 0.10);
      --border-strong:     rgba(224, 221, 214, 0.18);
      --shadow-soft:       0 8px 32px -8px rgba(0, 0, 0, 0.30),
                           0 2px 8px -2px rgba(0, 0, 0, 0.15);
      --shadow-subtle:     0 1px 4px rgba(0, 0, 0, 0.10);
      --watermark:         rgba(224, 221, 214, 0.06);
      --footer-bg:         rgba(34, 34, 38, 0.5);
      --error:             #c07070;
    }

    /* ── Theme: umbra (OLED) ── */
    body[data-theme="umbra"] {
      --background:        #000000;
      --surface:           #0c0c0e;
      --column:            #161618;
      --foreground:        #ece9e2;
      --foreground-muted:  rgba(236, 233, 226, 0.65);
      --foreground-faint:  rgba(236, 233, 226, 0.40);
      --border:            rgba(216, 213, 206, 0.08);
      --border-strong:     rgba(216, 213, 206, 0.14);
      --shadow-soft:       0 8px 32px -8px rgba(0, 0, 0, 0.50),
                           0 2px 8px -2px rgba(0, 0, 0, 0.25);
      --shadow-subtle:     0 1px 4px rgba(0, 0, 0, 0.20);
      --watermark:         rgba(216, 213, 206, 0.04);
      --footer-bg:         rgba(12, 12, 14, 0.5);
      --error:             #c07070;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-serif);
      background: var(--background);
      color: var(--foreground);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "liga", "kern";
    }

    /* ────────────────────────────────────────────────────────── */
    /* Shell                                                      */
    /* ────────────────────────────────────────────────────────── */

    .shell {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .brand {
      position: absolute;
      top: 2rem;
      left: 2.5rem;
      z-index: 20;
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--foreground);
      cursor: pointer;
    }

    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: var(--left-ratio) var(--right-ratio);
      grid-template-rows: 1fr;       /* row fills available height */
      gap: var(--gap-outer);
      padding: 5rem var(--gap-outer) var(--gap-outer);
      min-height: 0;
    }

    /* ────────────────────────────────────────────────────────── */
    /* Left panel — search tray + watermark                       */
    /* ────────────────────────────────────────────────────────── */

    .left-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .watermark {
      position: absolute;
      left: -0.5rem;
      bottom: 1rem;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 18rem;
      line-height: 1;
      color: var(--watermark);
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }

    .search-tray {
      position: relative;
      z-index: 1;
      align-self: center;
      width: 100%;
      max-width: 32rem;
      margin-top: 18vh;
      padding: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-outer);
      box-shadow: var(--shadow-soft);
    }

    .search-card {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.875rem 1.125rem;
      background: var(--column);
      border: 1px solid var(--border);
      border-radius: var(--radius-inner);
      box-shadow: var(--shadow-subtle);
      width: 100%;
    }

    .search-icon {
      flex-shrink: 0;
      width: 1.125rem;
      height: 1.125rem;
      color: var(--foreground-muted);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-serif);
      font-size: 1.0625rem;
      color: var(--foreground);
      padding: 0;
    }

    .search-input::placeholder {
      color: var(--foreground-muted);
      font-style: italic;
    }

    .search-submit {
      flex-shrink: 0;
      width: 2.125rem;
      height: 2.125rem;
      border-radius: 50%;
      background: var(--background);
      border: 1px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--foreground);
      transition: background var(--page-transition);
    }

    .search-submit:hover {
      background: var(--surface);
    }

    .search-submit svg {
      width: 0.875rem;
      height: 0.875rem;
    }

    .controls-row {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 1rem 0.5rem 0.25rem;
      width: 100%;
    }

    .control-button {
        flex: 0 0 auto;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.25rem 0.5rem;
        background: transparent;
        border: none;
        cursor: pointer;
        font-family: var(--font-serif);
        font-size: 0.875rem;
        color: var(--foreground);
        transition: color var(--page-transition);
      }

    .control-button .text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      white-space: nowrap;
    }

    .control-button:hover {
      color: var(--foreground);
    }

    .control-button .label {
      color: var(--foreground-muted);
    }

    .control-button .value {
      font-weight: 500;
      color: var(--foreground);
    }

    .control-button svg {
      width: 1rem;
      height: 1rem;
      color: var(--foreground-muted);
    }

    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 0.25rem;
      background: var(--column);
      border: 1px solid var(--border);
      border-radius: var(--radius-inner);
      box-shadow: var(--shadow-soft);
      z-index: 30;
      overflow: hidden;
      display: none;
      min-width: 7rem;
    }

    .dropdown-menu.open {
      display: block;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.5rem 0.75rem;
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: var(--font-serif);
      font-size: 0.9375rem;
      color: var(--foreground);
      text-align: left;
      transition: background var(--page-transition);
    }

    .dropdown-item:hover {
      background: var(--surface);
    }

    .dropdown-item .check-icon {
      width: 1rem;
      height: 1rem;
      flex-shrink: 0;
      color: var(--foreground-muted);
      opacity: 0;
    }

    .dropdown-item.checked .check-icon {
      opacity: 1;
    }

    .dropdown-divider {
      height: 1px;
      margin: 0.25rem 0.75rem;
      background: var(--border);
    }

    .control-wrapper {
      position: relative;
      flex: 1;
      min-width: 0;
      display: flex;
      justify-content: center;
    }

    .control-divider {
      flex: 0 0 auto;
      width: 1px;
      background: var(--border);
    }

    /* ────────────────────────────────────────────────────────── */
    /* Sense chips                                                */
    /* ────────────────────────────────────────────────────────── */

    .sense-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
      padding: 0.75rem 0.25rem 0;
    }

    .sense-bar:empty {
      display: none;
    }

    .sense-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: transparent;
      font-family: var(--font-serif);
      font-size: 0.75rem;
      color: var(--foreground-muted);
      line-height: 1.3;
      max-width: 100%;
      cursor: default;
    }

    .sense-chip-pos {
      font-variant: small-caps;
      font-size: 0.6875rem;
      letter-spacing: 0.04em;
      color: var(--foreground-faint);
      flex-shrink: 0;
    }

    .sense-chip-gloss {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ────────────────────────────────────────────────────────── */
    /* Right panel — word surface                                 */
    /* ────────────────────────────────────────────────────────── */

    .right-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--foreground);
      transition: background var(--page-transition), opacity var(--page-transition);
    }

    .nav-arrow:hover {
      background: var(--background);
    }

    .nav-arrow:disabled {
      opacity: 0;
      pointer-events: none;
    }

    .nav-arrow.left  { left:  -0.5rem; }
    .nav-arrow.right { right: -0.5rem; }

    .nav-arrow svg {
      width: 0.875rem;
      height: 0.875rem;
    }

    .word-surface {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-outer);
      box-shadow: var(--shadow-soft);
      overflow: hidden;          /* clips peek column */
    }

    .columns-grid {
      flex: 1;
      display: grid;
      gap: var(--gap-inner);
      min-height: 0;
      overflow: hidden;
      animation: page-in var(--page-transition) ease-out;
    }

    .columns-grid.with-peek {
      /* grid-template-columns and width set inline by JS for responsive column count */
    }

    .columns-grid.no-peek {
      /* grid-template-columns and width set inline by JS for responsive column count */
    }

    .about-entry {
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
    }
    .about-entry:last-child {
      border-bottom: none;
    }
    .about-name {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--foreground);
      margin: 0 0 0.25rem 0;
    }
    .about-source {
      font-family: var(--font-serif);
      font-size: 0.8125rem;
      font-style: italic;
      color: var(--foreground-muted);
      margin: 0 0 0.5rem 0;
    }
    .about-description {
      font-family: var(--font-serif);
      font-size: 0.875rem;
      color: var(--foreground);
      line-height: 1.4;
      margin: 0 0 0.5rem 0;
    }
    .about-citation {
      font-family: var(--font-serif);
      font-size: 0.75rem;
      color: var(--foreground-muted);
      font-style: italic;
      margin: 0;
    }
    .about-heading {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--foreground);
      margin: 0 0 1rem 0;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .about-text {
      font-family: var(--font-serif);
      font-size: 1rem;
      color: var(--foreground);
      line-height: 1.5;
      margin: 0 0 0.75rem 0;
    }

    @keyframes page-in {
      from { opacity: 0; transform: translateX(8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .column-cell {
      background: var(--column);
      background-clip: padding-box;   /* prevents square corner from leaking past radius */
      border: 1px solid var(--border);
      border-radius: var(--radius-inner);
      box-shadow: var(--shadow-subtle);
      overflow-y: auto;
      overflow-x: hidden;
    }

    .column-cell.empty {
      /* Reserved for future use; currently not rendered. */
      display: none;
    }

    .column-cell.span-all {
      grid-column: 1 / -1;
    }

    .column-inner {
      height: 100%;
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* ────────────────────────────────────────────────────────── */
    /* Entry                                                      */
    /* ────────────────────────────────────────────────────────── */

    .entry {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      cursor: default;
    }

    .entry-headword {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.01em;
      color: var(--foreground-muted);
      transition: color var(--page-transition);
      cursor: pointer;
    }

    .entry:hover .entry-headword {
      color: var(--foreground);
    }

    .entry-zipf {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--foreground-faint);
      margin-left: 0.375rem;
      vertical-align: super;
      letter-spacing: 0;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      margin-left: 0.5rem;
      vertical-align: middle;
      background: none;
      border: 1px solid transparent;
      border-radius: 0.25rem;
      color: var(--foreground-faint);
      cursor: pointer;
      opacity: 0;
      transition: opacity var(--page-transition), color var(--page-transition), border-color var(--page-transition);
      padding: 0;
    }

    .copy-btn svg {
      width: 12px;
      height: 12px;
    }

    .entry:hover .copy-btn,
    .copy-btn:focus {
      opacity: 1;
    }

    .copy-btn:hover {
      color: var(--foreground);
      border-color: var(--border);
    }

    .copy-btn.copied {
      color: var(--foreground);
      border-color: var(--foreground);
    }

    .entry-def {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1rem;
      line-height: 1.35;
      color: var(--foreground-muted);
      transition: color var(--page-transition);
    }

    .entry:hover .entry-def {
      color: var(--foreground);
    }

    .entry-def.undefined {
      color: var(--foreground-faint);
    }

    /* ────────────────────────────────────────────────────────── */
    /* Page indicator                                             */
    /* ────────────────────────────────────────────────────────── */

    .page-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding-top: 1.25rem;
    }

    .page-dot {
      background: var(--foreground-faint);
      border: none;
      cursor: pointer;
      padding: 0;
      border-radius: 9999px;
      width: 0.375rem;
      height: 0.375rem;
      transition: width var(--page-transition), height var(--page-transition), background var(--page-transition);
    }

    .page-dot.active {
      width: 1.25rem;
      height: 0.375rem;
      background: var(--foreground-muted);
    }

    .page-dot:not(.active):hover {
      background: var(--foreground-muted);
    }

    /* ────────────────────────────────────────────────────────── */
    /* States                                                     */
    /* ────────────────────────────────────────────────────────── */

    .state-message {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.0625rem;
      color: var(--foreground-muted);
      text-align: center;
    }

    .state-message.error {
      color: var(--error, #a05050);
    }

    /* ────────────────────────────────────────────────────────── */
    /* Loading dot                                                */
    /* ────────────────────────────────────────────────────────── */

    .loading-dot {
      position: absolute;
      bottom: 3.5rem;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--foreground-muted);
      animation: pulse 1.2s ease-in-out infinite;
      z-index: 5;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: translateX(-50%) scale(1); }
      50%      { opacity: 1;   transform: translateX(-50%) scale(1.3); }
    }

    /* ────────────────────────────────────────────────────────── */
    /* Band separator                                             */
    /* ────────────────────────────────────────────────────────── */

    .band-separator {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding-top: 0.25rem;
      margin-bottom: 0.25rem;
    }

    .band-separator::before {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-strong);
    }

    .band-separator-label {
      font-size: 0.7rem;
      font-variant: small-caps;
      letter-spacing: 0.06em;
      color: var(--foreground-faint);
      white-space: nowrap;
    }

    .band-separator::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-strong);
    }

    /* ────────────────────────────────────────────────────────── */
    /* Footer                                                     */
    /* ────────────────────────────────────────────────────────── */

    footer {
      flex-shrink: 0;
      height: 4rem;
      padding: 0 var(--gap-outer);
      border-top: 1px solid var(--border);
      background: var(--footer-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .footer-shortcuts {
      display: flex;
      gap: 1rem;
      align-items: center;
      font-family: var(--font-sans);
      font-size: 0.75rem;
      color: var(--foreground-faint);
    }

    .footer-shortcuts kbd {
      display: inline-block;
      padding: 0.125rem 0.375rem;
      font-family: var(--font-sans);
      font-size: 0.6875rem;
      color: var(--foreground-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.25rem;
    }

    .footer-link {
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: var(--font-serif);
      font-size: 0.9375rem;
      color: var(--foreground-muted);
      transition: color var(--page-transition);
    }

    .footer-link:hover {
      color: var(--foreground);
    }

    /* ────────────────────────────────────────────────────────── */
    /* Mobile — ≤768px                                            */
    /* ────────────────────────────────────────────────────────── */

    @media (max-width: 768px) {
      html, body {
        height: 100dvh;
        overflow: hidden;
      }

      .shell {
        height: 100dvh;
        overflow: hidden;
      }

      .brand {
        position: static;
        padding: 1.25rem 1.5rem 0;
        font-size: 1.4rem;
      }

      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        gap: 0;
        padding: 0;
      }

      .left-panel {
        flex-direction: column;
        min-width: 0;
      }

      .watermark {
        display: none;
      }

      .search-tray {
        margin-top: 0;
        padding: 1rem 1.25rem;
        max-width: 100%;
        border-radius: 0;
        box-shadow: none;
        border-bottom: 1px solid var(--border);
      }

      .search-tray .search-input {
        font-size: 0.95rem;
      }

      .controls-row {
        padding: 0.75rem 0 0;
      }

      .right-panel {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      .nav-arrow {
        width: 2.75rem;
        height: 2.75rem;
        min-width: 44px;
        min-height: 44px;
      }

      .nav-arrow.left  { left:  0.25rem; }
      .nav-arrow.right { right: 0.25rem; }

      .word-surface {
        border-radius: 0;
        border-left: none;
        border-right: none;
        border-bottom: none;
        padding: 1rem;
        flex: 1;
        overflow: hidden;
      }

      .page-indicator {
        padding-top: 1rem;
      }

      .page-dot {
        width: 0.5rem;
        height: 0.5rem;
      }

      footer {
        position: sticky;
        bottom: 0;
        z-index: 20;
        height: 3rem;
      }

      footer .footer-shortcuts {
        display: none;
      }

      footer .footer-link#about-button {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <h1 class="brand" id="brand" role="button" tabindex="0">Synonymicon</h1>

    <main class="layout">
      <!-- ─────────── LEFT PANEL ─────────── -->
      <div class="left-panel">
        <div class="watermark" aria-hidden="true">&amp;</div>

        <section class="search-tray">
          <div class="search-card">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.3-4.3"/>
            </svg>
            <input
              id="search-input"
              class="search-input"
              type="text"
              placeholder="discover"
              autocomplete="off"
              spellcheck="false"
            />
            <button id="search-submit" class="search-submit" type="button" aria-label="search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"/>
                <path d="m12 5 7 7-7 7"/>
              </svg>
            </button>
          </div>

          <div class="controls-row">
            <div class="control-wrapper">
              <button id="corpus-button" class="control-button" type="button" aria-haspopup="true" aria-expanded="false">
                <span class="text"><span class="label">corpus:</span><span id="corpus-value" class="value">wordfreq</span></span>
              </button>
              <div id="corpus-menu" class="dropdown-menu"></div>
            </div>
            <div class="control-divider"></div>
            <div class="control-wrapper">
              <button id="freq-button" class="control-button" type="button" aria-haspopup="true" aria-expanded="false">
                <span class="text"><span class="label">frequency:</span><span id="freq-value" class="value">all</span></span>
              </button>
              <div id="freq-menu" class="dropdown-menu"></div>
            </div>
            <div class="control-divider"></div>
            <div class="control-wrapper">
              <button id="pos-button" class="control-button" type="button" aria-haspopup="true" aria-expanded="false">
                <span class="text"><span class="label">pos:</span><span id="pos-value" class="value">all</span></span>
              </button>
              <div id="pos-menu" class="dropdown-menu"></div>
            </div>
            <div class="control-divider"></div>
            <div class="control-wrapper">
              <button id="sort-button" class="control-button" type="button" aria-haspopup="true" aria-expanded="false">
                <span class="text"><span class="label">sort:</span><span id="sort-value" class="value">common</span></span>
              </button>
              <div id="sort-menu" class="dropdown-menu"></div>
            </div>
          </div>
          <div id="sense-bar" class="sense-bar"></div>
        </section>
      </div>

      <!-- ─────────── RIGHT PANEL ─────────── -->
      <section class="right-panel">
        <button id="nav-prev" class="nav-arrow left" type="button" aria-label="previous page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>
        <button id="nav-next" class="nav-arrow right" type="button" aria-label="next page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </button>

        <div class="word-surface">
          <div id="columns-grid" class="columns-grid" aria-live="polite"></div>
          <div id="page-indicator" class="page-indicator"></div>
        </div>
      </section>
    </main>

    <footer>
      <button id="theme-button" class="footer-link" type="button">lumen</button>
      <div class="footer-shortcuts">
        <span><kbd>1</kbd>-<kbd>5</kbd> frequency</span>
        <span><kbd>←</kbd><kbd>→</kbd> page</span>
        <span><kbd>/</kbd> search</span>
        <span><kbd>Esc</kbd> reset</span>
      </div>
      <button id="about-button" class="footer-link" type="button">corpora</button>
    </footer>
  </div>

  <script>
    // ────────────────────────────────────────────────────────────
    // Constants
    // ────────────────────────────────────────────────────────────
    const ITEM_HEIGHT_PX = 130;
    const COLUMN_PADDING_PX = 80;
    const INDICATOR_RESERVE_PX = 50;

    const FREQUENCY_TIERS = [
      { label: "all",      value: "all" },
      { label: "common",   value: "common" },
      { label: "10k–30k",  value: "uncommon" },
      { label: "30k–80k",  value: "rare" },
      { label: "80k–150k", value: "exotic" },
      { label: "150k+",    value: "absurd" },
    ];

    // Band-separator labels mirror the frequency dropdown's labels exactly, so a
    // band reads identically as a control option and as an inline separator.
    // (The rank-count framing like "10k–30k" is calibrated to wordfreq; other
    // corpora map the same Zipf band to different real-world ranks.)
    const BAND_DISPLAY = Object.fromEntries(
      FREQUENCY_TIERS.filter(t => t.value !== "all").map(t => [t.value, t.label])
    );

    const POS_TIERS = [
      { label: "all",       value: "all" },
      { label: "noun",      value: "noun" },
      { label: "verb",      value: "verb" },
      { label: "adjective", value: "adj" },
      { label: "adverb",    value: "adv" },
    ];

    // ────────────────────────────────────────────────────────────
    // State
    // ────────────────────────────────────────────────────────────
    let results = [];
    let currentPage = 0;
    let selectedTiers = new Set(["all"]);
    let selectedPos = new Set(["all"]);
    let selectedCorpus = "wordfreq";
    let selectedRank = "common";
    let lastSearchedWord = "";
    let isLoading = false;
    let queryInCorpus = null;  // null = not fetched, true/false = word exists/missing in corpus

    // ────────────────────────────────────────────────────────────
    // DOM refs
    // ────────────────────────────────────────────────────────────
    const grid = document.getElementById("columns-grid");
    const indicator = document.getElementById("page-indicator");
    const prevBtn = document.getElementById("nav-prev");
    const nextBtn = document.getElementById("nav-next");
    const searchInput = document.getElementById("search-input");
    const searchSubmit = document.getElementById("search-submit");
    const wordSurface = document.querySelector(".word-surface");
    const freqButton = document.getElementById("freq-button");
    const freqValue = document.getElementById("freq-value");
    const freqMenu = document.getElementById("freq-menu");
    const posButton = document.getElementById("pos-button");
    const posValue = document.getElementById("pos-value");
    const posMenu = document.getElementById("pos-menu");
    const corpusButton = document.getElementById("corpus-button");
    const corpusValue = document.getElementById("corpus-value");
    const corpusMenu = document.getElementById("corpus-menu");
    const sortButton = document.getElementById("sort-button");
    const sortValue = document.getElementById("sort-value");
    const sortMenu = document.getElementById("sort-menu");

    const senseBar = document.getElementById("sense-bar");

    // ────────────────────────────────────────────────────────────
    // View state
    // ────────────────────────────────────────────────────────────
    let currentView = "search";  // "search" or "about"

    // ────────────────────────────────────────────────────────────
    // Layout math
    // ────────────────────────────────────────────────────────────
    function getColumnsPerPage() {
      const w = window.innerWidth;
      if (w >= 1150) return 3;
      if (w >= 800)  return 2;
      return 1;
    }

    function calculateItemsPerColumn() {
      if (!wordSurface) return 5;
      const surfaceHeight = wordSurface.clientHeight;
      const surfacePadding = 48;
      const available = surfaceHeight - surfacePadding - INDICATOR_RESERVE_PX - COLUMN_PADDING_PX;
      const items = Math.floor(available / ITEM_HEIGHT_PX);
      return Math.max(3, items);
    }

    function chunkIntoColumns(items, perColumn) {
      const cols = [];
      for (let i = 0; i < items.length; i += perColumn) {
        cols.push(items.slice(i, i + perColumn));
      }
      return cols;
    }

    function chunkIntoPages(columns, perPage) {
      const pages = [];
      for (let i = 0; i < columns.length; i += perPage) {
        pages.push(columns.slice(i, i + perPage));
      }
      return pages.length === 0 ? [[]] : pages;
    }

    // ────────────────────────────────────────────────────────────
    // Render — senses
    // ────────────────────────────────────────────────────────────
    function renderSenses(senses) {
      senseBar.innerHTML = "";
      if (!senses || senses.length <= 1) return;
      senses.forEach(s => {
        const chip = document.createElement("span");
        chip.className = "sense-chip";
        const pos = document.createElement("span");
        pos.className = "sense-chip-pos";
        pos.textContent = s.pos;
        const gloss = document.createElement("span");
        gloss.className = "sense-chip-gloss";
        gloss.textContent = s.gloss;
        chip.appendChild(pos);
        chip.appendChild(gloss);
        senseBar.appendChild(chip);
      });
    }

    // ────────────────────────────────────────────────────────────
    // Render — entries
    // ────────────────────────────────────────────────────────────
    function renderEntry(entry) {
      const div = document.createElement("div");
      div.className = "entry";

      const headword = document.createElement("div");
      headword.className = "entry-headword";
      headword.textContent = entry.word;
      headword.setAttribute("role", "link");
      headword.setAttribute("tabindex", "0");

      if (typeof entry.zipf === "number") {
        const zipf = document.createElement("span");
        zipf.className = "entry-zipf";
        zipf.textContent = entry.zipf.toFixed(1);
        headword.appendChild(zipf);
      }

      // Copy button — appears on hover/focus
      const copyBtn = document.createElement("button");
      copyBtn.className = "copy-btn";
      copyBtn.setAttribute("aria-label", `Copy "${entry.word}"`);
      copyBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
      copyBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(entry.word).then(() => {
          copyBtn.classList.add("copied");
          setTimeout(() => copyBtn.classList.remove("copied"), 1200);
        }).catch(() => {});
      });
      headword.appendChild(copyBtn);

      const pivot = () => pivotToWord(entry.word);
      headword.addEventListener("click", pivot);
      headword.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pivot(); }
      });

      const def = document.createElement("p");
      def.className = "entry-def";
      if (!entry.definition || entry.definition === "[undefined]") {
        def.classList.add("undefined");
        def.textContent = "[undefined]";
      } else {
        def.textContent = entry.definition;
      }

      div.appendChild(headword);
      div.appendChild(def);
      return div;
    }

    function renderBandSeparator(band) {
      const sep = document.createElement("div");
      sep.className = "band-separator";
      const label = document.createElement("span");
      label.className = "band-separator-label";
      label.textContent = BAND_DISPLAY[band] || band;
      sep.appendChild(label);
      return sep;
    }

    // ────────────────────────────────────────────────────────────
    // Render — columns with cross-column band tracking
    // ────────────────────────────────────────────────────────────
    function renderColumn(entries, prevBand) {
      const cell = document.createElement("div");
      cell.className = "column-cell";

      const inner = document.createElement("div");
      inner.className = "column-inner";

      let lastBand = prevBand;
      entries.forEach(e => {
        if (e.band !== lastBand) {
          inner.appendChild(renderBandSeparator(e.band));
          lastBand = e.band;
        }
        inner.appendChild(renderEntry(e));
      });

      cell._lastBand = lastBand;
      cell.appendChild(inner);
      return cell;
    }

    // ────────────────────────────────────────────────────────────
    // Render — states
    // ────────────────────────────────────────────────────────────
    function setLoading(on) {
      isLoading = on;
      grid.setAttribute("aria-busy", on ? "true" : "false");
      let dot = wordSurface.querySelector(".loading-dot");
      if (on) {
        if (!dot) {
          dot = document.createElement("div");
          dot.className = "loading-dot";
          wordSurface.appendChild(dot);
        }
      } else {
        if (dot) dot.remove();
      }
    }

    function renderEmptyState(message) {
      const div = document.createElement("div");
      div.className = "state-message";
      div.textContent = message;
      return div;
    }

    function renderErrorState(message, isValidation = false) {
      const div = document.createElement("div");
      div.className = "state-message" + (isValidation ? "" : " error");
      div.textContent = message;
      return div;
    }

    // ────────────────────────────────────────────────────────────
    // View — about / corpora
    // ────────────────────────────────────────────────────────────
    const CORPUS_DATA = [
      {
        name: "wordfreq",
        source: "wordfreq library (Robyn Speer et al.)",
        citation: "zipf_frequency(word, 'en'), Apache-2.0 code; data: see wordfreq attribution terms.",
        description: "Default corpus. Derived from internet text across many sources. Zipf values pre-calibrated to match wordfreq's own scale.",
      },
      {
        name: "SUBTLEX-US",
        source: "Brysbaert & New (2009)",
        citation: "SUBTLEX-US frequency list. Brysbaert & New (2009). Behavior Research Methods, 41(4), 977–990.",
        description: "Film and TV subtitle frequencies from US productions. Strong representation of colloquial and spoken English. Rare words are often missing compared to internet-based corpora.",
      },
      {
        name: "BNC",
        source: "Adam Kilgarriff (bnc-readme.html)",
        citation: "BNC frequency list. Adam Kilgarriff. British National Corpus. Open academic data.",
        description: "Surface forms across spoken and written British English. POS-tagged via CLAWS in the source data. British English register differs from US-oriented corpora.",
      },
      {
        name: "Google 1-grams",
        source: "Peter Norvig (norvig.com/ngrams)",
        citation: "count_1w.txt, derived from Google Web Trillion Word Corpus (LDC). Peter Norvig.",
        description: "The most common ~333k words from the Google Web Trillion Word Corpus. Large counts (up to 10^11), web-derived 2008-era text.",
      },
      {
        name: "Wikipedia",
        source: "IlyaSemenov (GitHub, 2023)",
        citation: "wikipedia-word-frequency.txt, MIT License. IlyaSemenov.",
        description: "Word frequencies from English Wikipedia dumps (2023), ~2.77M words. Encyclopedic and expository register — more formal than web text.",
      },
      {
        name: "Kaggle rtatman",
        source: "rtatman on Kaggle",
        citation: "unigram_freq.csv. Derived from the Google Web Trillion Word Corpus (Google/LDC). CSV processing by rtatman.",
        description: "Same source as Google 1-grams (Google/LDC). Processed into a clean CSV.",
      },
      {
        name: "OpenSubtitles",
        source: "hermitdave / FrequencyWords (GitHub, 2018)",
        citation: "FrequencyWords — 2018 en_full.txt. CC BY-SA 4.0. hermitdave. Built from OpenSubtitles subtitle data.",
        description: "Frequencies from OpenSubtitles film and TV subtitles, ~1.66M words. Captures colloquial spoken language across many genres.",
      },
      {
        name: "Project Gutenberg",
        source: "ScriptSmith / topwords (GitHub)",
        citation: "topwords.txt. CC BY-SA 4.0. ScriptSmith. Sourced from Allison Parrish's Gutenberg-Dammit project.",
        description: "Literary English from Project Gutenberg — classic books and public domain texts, ~3.08M words. Formal register, archaic vocabulary.",
      },
      {
        name: "Leipzig Corpora Collection",
        source: "Universität Leipzig (wortschatz.uni-leipzig.de)",
        citation: "CC BY 4.0. Goldhahn, D., Eckart, T., & Quasthoff, U. (2012). LREC.",
        description: "Three corpora: News 2025, Web COM (.com domains) 2018, Web UK 2018 (~0.5–1M words each). News is formal; web corpora reflect online writing styles.",
      },
    ];

    const FREQ_EXPLANATION = {
      title: "How frequency works",
      lines: [
        "The Zipf scale runs roughly 0–8+. A higher value means a more common word. The five bands split the scale into usable ranges.",
        "Switching corpora changes each word's Zipf value — the same word can appear in different bands depending on the source.",
        "When you select a frequency band, only synonyms within that range are shown — filtering by how common each result is in the chosen corpus.",
      ],
    };

    const AI_MODELS = {
      title: "Built with assistance from",
      models: [
        "Claude Opus 4.5",
        "Claude Opus 4.6",
        "Claude Opus 4.7",
        "Perplexity Computer",
        "Xiaomi MiMo-V2-Pro",
        "Xiaomi MiMo-V2.5-Pro",
        "MiniMax M2.7",
        "KAT-Coder-Pro V2",
      ],
    };

    function showAboutView() {
      currentView = "about";
      history.pushState({ view: "about" }, "", "?view=about");
      renderAbout();
    }

    function showSearchView() {
      currentView = "search";
      const params = lastSearchedWord
        ? `?word=${encodeURIComponent(lastSearchedWord)}&tier=${[...selectedTiers].join(",")}&pos=${[...selectedPos].join(",")}&corpus=${selectedCorpus}&rank=${selectedRank}`
        : window.location.pathname;
      history.pushState({ word: lastSearchedWord, tiers: [...selectedTiers].join(","), pos: [...selectedPos].join(","), corpus: selectedCorpus, rank: selectedRank }, "", params);
      render();
    }

    function renderAbout() {
      grid.innerHTML = "";
      grid.classList.remove("with-peek", "no-peek");
      const cols = getAboutColumns();
      grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      grid.style.width = "100%";

      // Build all corpus entries as DOM nodes
      const corpusCells = CORPUS_DATA.map(item => {
        const cell = document.createElement("div");
        cell.className = "column-cell";
        const inner = document.createElement("div");
        inner.className = "column-inner";
        inner.appendChild(makeAboutEntry(item));
        cell.appendChild(inner);
        return cell;
      });

      // Build frequency explanation cell
      const freqCell = document.createElement("div");
      freqCell.className = "column-cell";
      const freqInner = document.createElement("div");
      freqInner.className = "column-inner";

      const heading = document.createElement("h2");
      heading.className = "about-heading";
      heading.textContent = FREQ_EXPLANATION.title;
      freqInner.appendChild(heading);

      FREQ_EXPLANATION.lines.forEach(line => {
        const p = document.createElement("p");
        p.className = "about-text";
        p.textContent = line;
        freqInner.appendChild(p);
      });

      const modelsHeading = document.createElement("h2");
      modelsHeading.className = "about-heading";
      modelsHeading.style.marginTop = "2rem";
      modelsHeading.textContent = AI_MODELS.title;
      freqInner.appendChild(modelsHeading);

      const modelList = document.createElement("ul");
      modelList.style.listStyle = "disc";
      modelList.style.paddingLeft = "1.25rem";
      modelList.style.margin = "0";
      AI_MODELS.models.forEach(name => {
        const li = document.createElement("li");
        li.className = "about-text";
        li.style.marginBottom = "0.2rem";
        li.textContent = name;
        modelList.appendChild(li);
      });
      freqInner.appendChild(modelList);
      freqCell.appendChild(freqInner);

      // Distribute cells across columns
      if (cols >= 4) {
        // 4 columns: 3 corpus per column + freq in column 4
        const groups = [
          corpusCells.slice(0, 3),
          corpusCells.slice(3, 6),
          corpusCells.slice(6, 9),
        ];
        groups.forEach(group => {
          const colCell = document.createElement("div");
          colCell.className = "column-cell";
          const colInner = document.createElement("div");
          colInner.className = "column-inner";
          group.forEach(c => {
            while (c.firstChild) colInner.appendChild(c.firstChild);
          });
          colCell.appendChild(colInner);
          grid.appendChild(colCell);
        });
        grid.appendChild(freqCell);
      } else if (cols === 3) {
        // 3 columns: 3 corpus per column, freq appended to last
        const colGroups = [corpusCells.slice(0, 3), corpusCells.slice(3, 6), corpusCells.slice(6, 9)];
        colGroups.forEach((group, i) => {
          const cell = document.createElement("div");
          cell.className = "column-cell";
          const inner = document.createElement("div");
          inner.className = "column-inner";
          group.forEach(c => {
            // Move the inner content from corpus cell
            while (c.firstChild) inner.appendChild(c.firstChild);
          });
          if (i === 2) inner.appendChild(freqInner);
          cell.appendChild(inner);
          grid.appendChild(cell);
        });
      } else if (cols === 2) {
        // 2 columns: 5 corpus in col 1, 4 corpus + freq in col 2
        const col1 = document.createElement("div");
        col1.className = "column-cell";
        const inner1 = document.createElement("div");
        inner1.className = "column-inner";
        corpusCells.slice(0, 5).forEach(c => { while (c.firstChild) inner1.appendChild(c.firstChild); });
        col1.appendChild(inner1);
        grid.appendChild(col1);

        const col2 = document.createElement("div");
        col2.className = "column-cell";
        const inner2 = document.createElement("div");
        inner2.className = "column-inner";
        corpusCells.slice(5, 9).forEach(c => { while (c.firstChild) inner2.appendChild(c.firstChild); });
        inner2.appendChild(freqInner);
        col2.appendChild(inner2);
        grid.appendChild(col2);
      } else {
        // 1 column: stack all
        const cell = document.createElement("div");
        cell.className = "column-cell";
        const inner = document.createElement("div");
        inner.className = "column-inner";
        corpusCells.forEach(c => { while (c.firstChild) inner.appendChild(c.firstChild); });
        inner.appendChild(freqInner);
        cell.appendChild(inner);
        grid.appendChild(cell);
      }
    }

    function getAboutColumns() {
      const w = window.innerWidth;
      if (w >= 1400) return 4;
      if (w >= 1000) return 3;
      if (w >= 700)  return 2;
      return 1;
    }

    function makeAboutEntry(item) {
      const entry = document.createElement("div");
      entry.className = "about-entry";

      const name = document.createElement("div");
      name.className = "about-name";
      name.textContent = item.name;
      entry.appendChild(name);

      const source = document.createElement("p");
      source.className = "about-source";
      source.textContent = item.source;
      entry.appendChild(source);

      const desc = document.createElement("p");
      desc.className = "about-description";
      desc.textContent = item.description;
      entry.appendChild(desc);

      const citation = document.createElement("p");
      citation.className = "about-citation";
      citation.textContent = item.citation;
      entry.appendChild(citation);

      return entry;
    }

    function render() {
      const colsPerPage = getColumnsPerPage();
      const itemsPerCol = calculateItemsPerColumn();
      const allColumns = chunkIntoColumns(results, itemsPerCol);
      const pages = chunkIntoPages(allColumns, colsPerPage);
      pageCount = pages.length;

      if (currentPage >= pages.length) currentPage = pages.length - 1;
      if (currentPage < 0) currentPage = 0;

      const pageColumns = pages[currentPage] || [];
      const isLastPage = currentPage === pages.length - 1;
      const showPeek = !isLastPage && pages.length > 1 && colsPerPage > 1;

      grid.innerHTML = "";
      grid.classList.remove("with-peek", "no-peek");
      void grid.offsetWidth;

      if (showPeek) {
        grid.classList.add("with-peek");
        const totalCols = colsPerPage + 1;
        grid.style.gridTemplateColumns = `repeat(${totalCols}, 1fr)`;
        grid.style.width = `${(totalCols / colsPerPage) * 100}%`;
      } else {
        grid.classList.add("no-peek");
        grid.style.gridTemplateColumns = `repeat(${colsPerPage}, 1fr)`;
        grid.style.width = "100%";
      }

      if (isLoading) {
        // Loading dot is managed separately; grid stays empty
      } else if (pageColumns.length === 0) {
        const cell = document.createElement("div");
        cell.style.cssText = "grid-column:1/-1;display:grid;place-items:center;";
        const msg = document.createElement("span");
        msg.style.cssText = "padding:2.5rem 2rem;font-family:var(--font-serif);font-style:italic;font-size:1.0625rem;color:var(--foreground-muted);text-align:center;";
        if (!lastSearchedWord) {
          msg.textContent = "begin with a word";
        } else if (queryInCorpus === false) {
          msg.textContent = "no frequency data for this word in the selected corpus";
        } else {
          msg.textContent = "no synonyms found in this band — try a wider frequency";
        }
        cell.appendChild(msg);
        grid.appendChild(cell);
      } else {
        let prevBand = null;
        // Determine the band of the last entry on the previous page
        if (currentPage > 0) {
          const prevPageCols = pages[currentPage - 1];
          const lastPrevCol = prevPageCols[prevPageCols.length - 1];
          if (lastPrevCol && lastPrevCol.length > 0) {
            prevBand = lastPrevCol[lastPrevCol.length - 1].band;
          }
        }

        pageColumns.forEach(col => {
          if (col.length > 0) {
            const cell = renderColumn(col, prevBand);
            prevBand = cell._lastBand;
            grid.appendChild(cell);
          }
        });

        if (showPeek) {
          const peekCol = pages[currentPage + 1][0];
          if (peekCol && peekCol.length > 0) {
            const peek = renderColumn(peekCol, prevBand);
            peek.setAttribute("aria-hidden", "true");
            peek.inert = true;  // truly non-interactive: not focusable, not clickable
            grid.appendChild(peek);
          }
        }
      }

      renderIndicator(pages.length);
      renderNavArrows(pages.length);
    }

    function renderIndicator(pageCount) {
      indicator.innerHTML = "";
      if (pageCount <= 1) return;

      for (let i = 0; i < pageCount; i++) {
        const dot = document.createElement("button");
        dot.className = "page-dot" + (i === currentPage ? " active" : "");
        dot.type = "button";
        dot.setAttribute("aria-label", `Go to page ${i + 1}`);
        dot.addEventListener("click", () => {
          currentPage = i;
          render();
        });
        indicator.appendChild(dot);
      }
    }

    function renderNavArrows(pageCount) {
      prevBtn.disabled = currentPage === 0;
      nextBtn.disabled = currentPage >= pageCount - 1;
    }

    // ────────────────────────────────────────────────────────────
    // Fetch
    // ────────────────────────────────────────────────────────────
    let abortController = null;
    let debounceTimer = null;

    async function fetchSynonyms(word, pushState = true) {
      if (abortController) abortController.abort();
      abortController = new AbortController();
      setLoading(true);

      const tierParam = Array.from(selectedTiers).join(",");
      const posParam = Array.from(selectedPos).join(",");
      const corpusParam = selectedCorpus;
      const rankParam = selectedRank;
      if (pushState) {
        const params = new URLSearchParams({ word, tier: tierParam, pos: posParam, corpus: corpusParam, rank: rankParam });
        history.pushState({ word, tiers: tierParam, pos: posParam, corpus: corpusParam, rank: rankParam }, "", `?${params}`);
      }

      try {
        const url = `/synonyms?word=${encodeURIComponent(word)}&tier=${encodeURIComponent(tierParam)}&pos=${encodeURIComponent(posParam)}&corpus=${encodeURIComponent(corpusParam)}&rank=${encodeURIComponent(rankParam)}`;
        const res = await fetch(url, { signal: abortController.signal });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          const e = new Error(errData.error || `request failed (${res.status})`);
          e.isValidation = res.status >= 400 && res.status < 500;  // 4xx = user input
          throw e;
        }
        const data = await res.json();
        results = data.results || [];
        queryInCorpus = data.query_in_corpus;
        renderSenses(data.senses || []);
        currentPage = 0;
      } catch (err) {
        if (err.name === "AbortError") return;
        results = [];
        currentPage = 0;
        grid.innerHTML = "";
        grid.classList.remove("with-peek");
        grid.classList.add("no-peek");
        const cols = getColumnsPerPage();
        grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        grid.style.width = "100%";
        const cell = document.createElement("div");
        cell.className = "column-cell span-all";
        cell.appendChild(renderErrorState(err.message || "something went wrong — check the backend log", err.isValidation === true));
        grid.appendChild(cell);
        renderIndicator(0);
        renderNavArrows(0);
        setLoading(false);
        return;
      }

      setLoading(false);
      render();
    }

    function pivotToWord(word) {
      searchInput.value = word;
      lastSearchedWord = word;
      currentPage = 0;
      fetchSynonyms(word, true);
    }

    function debouncedSearch() {
      const word = searchInput.value.trim();
      clearTimeout(debounceTimer);
      if (abortController) abortController.abort();

      if (!word) return;

      lastSearchedWord = word;
      debounceTimer = setTimeout(() => fetchSynonyms(word, false), 250);
    }

    // ────────────────────────────────────────────────────────────
    // Search events
    // ────────────────────────────────────────────────────────────
    searchInput.addEventListener("input", debouncedSearch);

    // ────────────────────────────────────────────────────────────
    // Reset to empty state
    // ────────────────────────────────────────────────────────────
    function resetToEmpty() {
      searchInput.value = "";
      lastSearchedWord = "";
      results = [];
      currentPage = 0;
      senseBar.innerHTML = "";
      if (abortController) abortController.abort();
      showSearchView();
    }

    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        clearTimeout(debounceTimer);
        const word = searchInput.value.trim();
        if (word) {
          lastSearchedWord = word;
          fetchSynonyms(word);
        } else {
          resetToEmpty();
        }
      }
    });

    searchSubmit.addEventListener("click", () => {
      clearTimeout(debounceTimer);
      const word = searchInput.value.trim();
      if (word) {
        lastSearchedWord = word;
        fetchSynonyms(word);
      }
    });

    // Brand click — reset to empty state
    const brand = document.getElementById("brand");
    brand.addEventListener("click", resetToEmpty);
    brand.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") resetToEmpty(); });

    // ────────────────────────────────────────────────────────────
    // Frequency dropdown
    // ────────────────────────────────────────────────────────────
    function updateFreqLabel() {
      if (selectedTiers.has("all")) {
        freqValue.textContent = "all";
      } else if (selectedTiers.size === 1) {
        const val = Array.from(selectedTiers)[0];
        const tier = FREQUENCY_TIERS.find(t => t.value === val);
        freqValue.textContent = tier ? tier.label : val;
      } else {
        freqValue.textContent = "custom";
      }
    }

    function buildFreqMenu() {
      // "all" option
      const allItem = document.createElement("button");
      allItem.className = "dropdown-item" + (selectedTiers.has("all") ? " checked" : "");
      allItem.type = "button";
      allItem.innerHTML = `<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg><span>all</span>`;
      allItem.addEventListener("click", () => {
        selectedTiers.clear();
        selectedTiers.add("all");
        refreshFreqMenu();
        freqMenu.classList.remove("open");
        if (lastSearchedWord) fetchSynonyms(lastSearchedWord, false);
      });
      freqMenu.appendChild(allItem);

      // Divider
      const divider = document.createElement("div");
      divider.className = "dropdown-divider";
      freqMenu.appendChild(divider);

      // Band options
      FREQUENCY_TIERS.filter(t => t.value !== "all").forEach(t => {
        const item = document.createElement("button");
        item.className = "dropdown-item" + (selectedTiers.has(t.value) ? " checked" : "");
        item.type = "button";
        item.innerHTML = `<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg><span>${t.label}</span>`;
        item.addEventListener("click", () => {
          if (selectedTiers.has(t.value)) {
            selectedTiers.delete(t.value);
            if (selectedTiers.size === 0) selectedTiers.add("all");
          } else {
            selectedTiers.delete("all");
            selectedTiers.add(t.value);
          }
          refreshFreqMenu();
          freqMenu.classList.remove("open");
          if (lastSearchedWord) fetchSynonyms(lastSearchedWord, false);
        });
        freqMenu.appendChild(item);
      });
    }

    const BAND_TIERS = FREQUENCY_TIERS.filter(t => t.value !== "all").map(t => t.value);

    function refreshFreqMenu() {
      // If all individual bands are selected, collapse to "all"
      if (BAND_TIERS.every(t => selectedTiers.has(t))) {
        selectedTiers.clear();
        selectedTiers.add("all");
      }
      freqMenu.innerHTML = "";
      buildFreqMenu();
      updateFreqLabel();
    }

    function closeAllMenus() {
      [corpusMenu, freqMenu, posMenu, sortMenu].forEach(m => m.classList.remove("open"));
      [corpusButton, freqButton, posButton, sortButton].forEach(b => b.setAttribute("aria-expanded", "false"));
    }

    function toggleMenu(menu, button) {
      const willOpen = !menu.classList.contains("open");
      closeAllMenus();
      if (willOpen) {
        menu.classList.add("open");
        button.setAttribute("aria-expanded", "true");
      }
    }

    // One handler closes every menu on an outside click or Escape, and resets
    // each trigger's aria-expanded (replaces four near-identical listeners).
    document.addEventListener("click", closeAllMenus);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeAllMenus(); });

    freqButton.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleMenu(freqMenu, freqButton);
    });

    // ────────────────────────────────────────────────────────────
    // Corpus dropdown (single-select)
    // ────────────────────────────────────────────────────────────
    const CORPUS_OPTIONS = [
      { label: "wordfreq",       value: "wordfreq" },
      { label: "subtlex",        value: "subtlex" },
      { label: "bnc",            value: "bnc" },
      { label: "google_1grams",  value: "google_1grams" },
      { label: "wikipedia",      value: "wikipedia" },
      { label: "kaggle",         value: "kaggle" },
      { label: "opensubtitles",  value: "opensubtitles" },
      { label: "gutenberg",      value: "gutenberg" },
      { label: "leipzig_news",    value: "leipzig_news" },
      { label: "leipzig_web_com", value: "leipzig_web_com" },
      { label: "leipzig_web_uk", value: "leipzig_web_uk" },
    ];

    function buildCorpusMenu() {
      corpusMenu.innerHTML = "";
      CORPUS_OPTIONS.forEach(opt => {
        const item = document.createElement("button");
        item.className = "dropdown-item" + (selectedCorpus === opt.value ? " checked" : "");
        item.type = "button";
        item.innerHTML = `<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg><span>${opt.label}</span>`;
        item.addEventListener("click", () => {
          selectedCorpus = opt.value;
          corpusValue.textContent = opt.label;
          buildCorpusMenu();
          corpusMenu.classList.remove("open");
          if (lastSearchedWord) fetchSynonyms(lastSearchedWord, false);
        });
        corpusMenu.appendChild(item);
      });
    }

    corpusButton.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleMenu(corpusMenu, corpusButton);
    });

    buildCorpusMenu();

    // ────────────────────────────────────────────────────────────
    // Sort/rank dropdown (single-select)
    // ────────────────────────────────────────────────────────────
    const SORT_OPTIONS = [
      { label: "common",    value: "common" },
      { label: "rare",      value: "rare" },
      { label: "relevance", value: "relevance" },
    ];

    function buildSortMenu() {
      sortMenu.innerHTML = "";
      SORT_OPTIONS.forEach(opt => {
        const item = document.createElement("button");
        item.className = "dropdown-item" + (selectedRank === opt.value ? " checked" : "");
        item.type = "button";
        item.innerHTML = `<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg><span>${opt.label}</span>`;
        item.addEventListener("click", () => {
          selectedRank = opt.value;
          sortValue.textContent = opt.label;
          buildSortMenu();
          sortMenu.classList.remove("open");
          if (lastSearchedWord) fetchSynonyms(lastSearchedWord, false);
        });
        sortMenu.appendChild(item);
      });
    }

    sortButton.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleMenu(sortMenu, sortButton);
    });

    buildSortMenu();

    // ────────────────────────────────────────────────────────────
    // POS dropdown
    // ────────────────────────────────────────────────────────────
    function updatePosLabel() {
      if (selectedPos.has("all")) {
        posValue.textContent = "all";
      } else if (selectedPos.size === 1) {
        const val = Array.from(selectedPos)[0];
        const tier = POS_TIERS.find(t => t.value === val);
        posValue.textContent = tier ? tier.label : val;
      } else {
        posValue.textContent = "custom";
      }
    }

    function buildPosMenu() {
      posMenu.innerHTML = "";

      // "all" option
      const allItem = document.createElement("button");
      allItem.className = "dropdown-item" + (selectedPos.has("all") ? " checked" : "");
      allItem.type = "button";
      allItem.innerHTML = `<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg><span>all</span>`;
      allItem.addEventListener("click", () => {
        selectedPos.clear();
        selectedPos.add("all");
        refreshPosMenu();
        posMenu.classList.remove("open");
        if (lastSearchedWord) fetchSynonyms(lastSearchedWord, false);
      });
      posMenu.appendChild(allItem);

      // Divider
      const divider = document.createElement("div");
      divider.className = "dropdown-divider";
      posMenu.appendChild(divider);

      // POS options
      POS_TIERS.filter(t => t.value !== "all").forEach(t => {
        const item = document.createElement("button");
        item.className = "dropdown-item" + (selectedPos.has(t.value) ? " checked" : "");
        item.type = "button";
        item.innerHTML = `<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg><span>${t.label}</span>`;
        item.addEventListener("click", () => {
          if (selectedPos.has(t.value)) {
            selectedPos.delete(t.value);
            if (selectedPos.size === 0) selectedPos.add("all");
          } else {
            selectedPos.delete("all");
            selectedPos.add(t.value);
          }
          refreshPosMenu();
          posMenu.classList.remove("open");
          if (lastSearchedWord) fetchSynonyms(lastSearchedWord, false);
        });
        posMenu.appendChild(item);
      });
    }

    const POS_TYPES = POS_TIERS.filter(t => t.value !== "all").map(t => t.value);

    function refreshPosMenu() {
      if (POS_TYPES.every(t => selectedPos.has(t))) {
        selectedPos.clear();
        selectedPos.add("all");
      }
      posMenu.innerHTML = "";
      buildPosMenu();
      updatePosLabel();
    }

    posButton.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleMenu(posMenu, posButton);
    });

    buildPosMenu();

    // ────────────────────────────────────────────────────────────
    // Navigation
    // ────────────────────────────────────────────────────────────
    prevBtn.addEventListener("click", () => {
      if (currentPage > 0) { currentPage--; render(); }
    });

    nextBtn.addEventListener("click", () => {
      // render() clamps currentPage to the last page and renderNavArrows re-disables
      // the button at the bound, so no separate page-count math is needed here.
      currentPage++;
      render();
    });

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(render, 150);
    });

    window.addEventListener("popstate", (e) => {
      const state = e.state;
      // popstate must only RESTORE the view, never push a new history entry —
      // calling showAboutView() here (which pushes) corrupts the back/forward stack.
      if (state && state.view === "about") {
        currentView = "about";
        renderAbout();
        return;
      }
      currentView = "search";
      if (state && state.word) {
        searchInput.value = state.word;
        lastSearchedWord = state.word;
        if (state.tiers) {
          selectedTiers = new Set(state.tiers.split(","));
          refreshFreqMenu();
        }
        if (state.pos) {
          selectedPos = new Set(state.pos.split(","));
          refreshPosMenu();
        }
        if (state.corpus) {
          selectedCorpus = state.corpus;
          corpusValue.textContent = CORPUS_OPTIONS.find(o => o.value === selectedCorpus)?.label || selectedCorpus;
          buildCorpusMenu();
        }
        if (state.rank) {
          selectedRank = state.rank;
          sortValue.textContent = SORT_OPTIONS.find(o => o.value === selectedRank)?.label || selectedRank;
          buildSortMenu();
        }
        fetchSynonyms(state.word, false);
      } else {
        // Back to the initial/empty state — reset the UI so it matches the URL
        // instead of leaving the previous query's results on screen.
        searchInput.value = "";
        lastSearchedWord = "";
        results = [];
        currentPage = 0;
        queryInCorpus = null;
        senseBar.innerHTML = "";
        if (abortController) abortController.abort();
        render();
      }
    });

    // ────────────────────────────────────────────────────────────
    // Theme
    // ────────────────────────────────────────────────────────────
    const THEMES = ["lumen", "penumbra", "umbra"];
    let themeIndex = THEMES.indexOf(localStorage.getItem("theme") || "lumen");
    if (themeIndex === -1) themeIndex = 0;

    const themeButton = document.getElementById("theme-button");

    function applyTheme() {
      const theme = THEMES[themeIndex];
      document.body.dataset.theme = theme;
      themeButton.textContent = theme;
      localStorage.setItem("theme", theme);
    }

    themeButton.addEventListener("click", () => {
      themeIndex = (themeIndex + 1) % THEMES.length;
      applyTheme();
    });

    applyTheme();

    // ────────────────────────────────────────────────────────────
    // Keyboard shortcuts
    // ────────────────────────────────────────────────────────────
    document.addEventListener("keydown", (e) => {
      // Ignore if typing in an input or focused on a clickable element
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.isContentEditable) return;

      if (e.key === "/") {
        e.preventDefault();
        searchInput.focus();
        return;
      }

      if (e.key === "Escape") {
        if (currentView === "search") {
          e.preventDefault();
          searchInput.value = "";
          lastSearchedWord = "";
          results = [];
          currentPage = 0;
          queryInCorpus = null;
          senseBar.innerHTML = "";
          if (abortController) abortController.abort();
          render();
          history.replaceState(null, "", window.location.pathname);
        }
        return;
      }

      // Number keys 1-5 select frequency bands (only when dropdown is closed)
      const bandKeys = ["all", "common", "uncommon", "rare", "exotic", "absurd"];
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= 5 && !e.ctrlKey && !e.metaKey && !e.altKey) {
        const bandValue = bandKeys[num];
        if (bandValue && !isDropdownOpen()) {
          e.preventDefault();
          selectedTiers = new Set([bandValue]);
          refreshFreqMenu();
          if (lastSearchedWord) fetchSynonyms(lastSearchedWord);
        }
      }

      // Left/right arrows navigate pages (only when dropdown is closed)
      if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && currentView === "search" && !isDropdownOpen()) {
        e.preventDefault();
        if (e.key === "ArrowLeft" && currentPage > 0) {
          currentPage--;
          render();
        } else if (e.key === "ArrowRight" && pageCount > 0 && currentPage < pageCount - 1) {
          currentPage++;
          render();
        }
      }
    });

    function isDropdownOpen() {
      return freqButton.getAttribute("aria-expanded") === "true"
          || posButton.getAttribute("aria-expanded") === "true"
          || corpusButton.getAttribute("aria-expanded") === "true"
          || sortButton.getAttribute("aria-expanded") === "true";
    }

    let pageCount = 1;  // updated in render()

    // ────────────────────────────────────────────────────────────
    // About / corpora button
    // ────────────────────────────────────────────────────────────
    const aboutButton = document.getElementById("about-button");
    aboutButton.addEventListener("click", showAboutView);

    // Responsive about view: re-render when window crosses column breakpoints.
    let aboutResizeTimer = null;
    window.addEventListener("resize", () => {
      if (currentView !== "about") return;
      clearTimeout(aboutResizeTimer);
      aboutResizeTimer = setTimeout(() => renderAbout(), 150);
    });

    // ────────────────────────────────────────────────────────────
    // Init
    // ────────────────────────────────────────────────────────────
    buildFreqMenu();

    // Read URL params on load (bookmarkable queries + back/forward)
    const initParams = new URLSearchParams(window.location.search);
    const initView = initParams.get("view");
    const initWord = initParams.get("word");
    const initTier = initParams.get("tier");
    const initPos = initParams.get("pos");
    const initCorpus = initParams.get("corpus");
    const initRank = initParams.get("rank");
    if (initView === "about") {
      showAboutView();
    } else if (initWord) {
      searchInput.value = initWord;
      lastSearchedWord = initWord;
      if (initTier) {
        selectedTiers = new Set(initTier.split(","));
        refreshFreqMenu();
      }
      if (initPos) {
        selectedPos = new Set(initPos.split(","));
        refreshPosMenu();
      }
      if (initCorpus) {
        selectedCorpus = initCorpus;
        corpusValue.textContent = CORPUS_OPTIONS.find(o => o.value === selectedCorpus)?.label || selectedCorpus;
        buildCorpusMenu();
      }
      if (initRank) {
        selectedRank = initRank;
        sortValue.textContent = SORT_OPTIONS.find(o => o.value === selectedRank)?.label || selectedRank;
        buildSortMenu();
      }
      fetchSynonyms(initWord, false);
    } else {
      render();
    }
    searchInput.focus();
  </script>
</body>
</html>
